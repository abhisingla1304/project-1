<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spotify Clone</title>
    <link rel="stylesheet" href="proj1.css">
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>Spotify</h2>
        <ul>
            <li>Home</li>
            <li>Search</li>
            <li>Your Library</li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="navbar">
            <button>Sign Up</button>
            <button class="login-btn">Log In</button>
        </div>

        <h1>Abhinandan Singla</h1>

        <div class="cards">
            <div class="card">
                <img src="https://via.placeholder.com/150" alt="playlist">
                <h3>Top Hits</h3>
                <p>Best of today's music</p>
            </div>

            <div class="card">
                <img src="https://via.placeholder.com/150" alt="playlist">
                <h3>Chill Vibes</h3>
                <p>Relax and enjoy</p>
            </div>

            <div class="card">
                <img src="https://via.placeholder.com/150" alt="playlist">
                <h3>Workout Mix</h3>
                <p>Energy boost songs</p>
            </div>
        </div>
    </div>

</body>
</html>
